name: CI

on:
  push:
    branches: [develop, master]
  pull_request:
    branches: [develop, master]

jobs:
  simulate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install GHDL
        run: sudo apt-get update && sudo apt-get install -y ghdl
      - name: GHDL version
        run: ghdl --version
      - name: Run testbenches
        run: make test
